    <div id="root"></div>

    <!-- Netlify Forms detects forms at build time from static HTML. This hidden

      <textarea name="idea"></textarea>
      <input name="ideaName" />
      <input name="problem" />
      <input name="customer" />
      <input name="stage" />
      <input name="timeline" />
      <input name="budget" />
      <input name="email" type="email" />
      <input name="name" />
      <input name="agreed" />

    </form>
