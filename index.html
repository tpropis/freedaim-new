<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta
      name="description"
      content="freedaim — strategy, branding, websites, AI systems and automation that turn ideas into reality for founders."
    />
    <title>freedaim — Turn Ideas Into Reality</title>

    <!-- Clean single-family type system: Hanken Grotesk (display + body + UI),
         Caveat reserved for the Whiteboard placeholder. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Static form for Netlify Forms build-time detection. The real UI lives in
         the Whiteboard React component and posts to this form name. -->
    <form name="idea" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="idea"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
